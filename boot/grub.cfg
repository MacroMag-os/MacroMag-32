set timeout=3
set default=0

# Stylizacja menu GRUB pod MacroMag
set menu_color_normal=white/black
set menu_color_highlight=black/light-gray

menuentry "MacroMag OS 2.0v (Live / VOS Shell)" {
    linux /boot/vmlinuz quiet loglevel=3 rdinit=/init
    initrd /boot/initramfs.img
}

menuentry "MacroMag OS 2.0v (Debug / Verbose Kernel)" {
    linux /boot/vmlinuz rdinit=/init
    initrd /boot/initramfs.img
}
