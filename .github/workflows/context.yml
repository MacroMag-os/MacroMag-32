name: Update AI Context Snapshot
on:
  push:
    branches: [ main ]
    paths-ignore: [ "CONTEXT.md" ]
  issues:
    types: [ opened, closed, reopened ]
permissions:
  contents: write
  issues: read
jobs:
  build-context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate CONTEXT.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "# MacroMag OS — Live Project Context" > CONTEXT.md
          echo "## 1. Repository Files" >> CONTEXT.md
          find . -maxdepth 4 -not -path "*/.*" -not -path "./target*" | sort >> CONTEXT.md
          echo "## 2. Open Issues" >> CONTEXT.md
          gh issue list --state open --limit 30 --json number,title --jq ".[] | "- #\(.number): \(.title)"" >> CONTEXT.md || true
          for f in Cargo.toml buildiso.sh userspace/vos/src/main.rs userspace/vos/src/vos_builtins.rs userspace/mur/src/main.rs; do
            if [ -f "$f" ]; then echo -e "
### $f
\`\`\`rust" >> CONTEXT.md; cat "$f" >> CONTEXT.md; echo -e "
\`\`\`" >> CONTEXT.md; fi
          done
      - name: Commit CONTEXT.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add CONTEXT.md
          git diff --staged --quiet || (git commit -m "chore: auto-update CONTEXT.md" && git push)
