mkdir -p .github/workflows docs

cat << 'EOF' > .github/workflows/ci.yml
name: MacroMag Core CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-mm-init:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust musl target & lld
        run: |
          sudo apt-get update && sudo apt-get install -y lld
          rustup target add x86_64-unknown-linux-musl

      - name: Build static mm-init binary
        working-directory: ./mm-init
        run: RUSTFLAGS="-C linker=rust-lld -C target-feature=+crt-static" cargo build --release --target x86_64-unknown-linux-musl

      - name: Run Clippy linter
        working-directory: ./mm-init
        run: cargo clippy --target x86_64-unknown-linux-musl -- -D warnings
EOF

cat << 'EOF' > docs/ARCHITECTURE.md
# MacroMag OS — System Architecture

## 1. Boot & Execution Flow

MacroMag OS eliminates traditional init daemons (`systemd`, `OpenRC`) and legacy GNU userland overhead by booting directly from the Linux kernel into a single, statically linked Rust binary (`mm-init`):

```text
[Bootloader: GRUB / UEFI]
        │
        ▼
[Linux Kernel HAL (x86_64)]  ──► Hardware drivers, memory, VFS (/proc, /sys, /dev)
        │
        ▼  (rdinit=/init)
[mm-init (PID 1 in Rust)]    ──► Mounts virtual filesystems & initializes VOS Engine
        │
        ├──► [VOS v2 Shell]  ──► Typed Object Pipeline (sys, proc, disk, files)
        └──► [MM Desktop]    ──► (Planned) Custom Wayland/X11 minimalist UI
```

## 2. Virtualized Object Shell (VOS v2) Pipeline

Traditional shells pass raw byte streams (`stdout`), forcing tools to rely on fragile text parsing (`awk`, `sed`, `grep`). VOS passes structured key-value maps (`BTreeMap<String, String>`) across pipeline stages:

1. **Source Provider:** Reads directly from kernel interfaces (`/proc`, `/sys/block`, VFS) and emits `Vec<VosObj>`.
2. **Filter / Transform Stage:** Evaluates typed predicates (`where field == "val"`, `where field ~= "substr"`).
3. **Formatter / Sink:** Renders structured console output or serializes directly to JSON (`to.json()`).

## 3. Storage & Installation Model

The `sys.install()` subsystem provisions target block devices (`/dev/sda`) by formatting an `ext4` root filesystem, deploying the static `mm-init` binary, and writing system metadata (`/etc/macromag-release`).
EOF

git add .github/workflows/ci.yml docs/ARCHITECTURE.md
git commit -m "ci(docs): add GitHub Actions Rust musl build pipeline and ARCHITECTURE.md"
git push origin main
