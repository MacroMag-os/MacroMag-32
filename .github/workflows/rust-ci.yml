name: MacroMag Kernel CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-riscv-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4

      - name: Zainstaluj kompilator Rust (RISC-V)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv64gc-unknown-none-elf

      - name: Kompiluj mikrojądro MacroMag
        working-directory: ./kernel
        run: cargo build --release --target riscv64gc-unknown-none-elf
