name: Build and Release MacroMag ISO

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-iso:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies and Dropbear SSH
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso grub-pc-bin grub-efi-amd64-bin mtools build-essential cpio gzip curl dropbear-bin linux-image-generic

      - name: Install Rust toolchain with musl target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Build MacroMag x86_64 ISO
        run: |
          chmod +x build_iso.sh
          sudo ./build_iso.sh

      - name: Upload ISO as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacroMag-x86_64-ISO
          path: MacroMag-x86_64.iso

      - name: Create GitHub Release (on version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MacroMag-x86_64.iso
          name: MacroMag OS ${{ github.ref_name }}
          body: |
            Automated build of **MacroMag OS** (`x86_64` Live/Install ISO).
            - Zero-Telemetry Linux Kernel
            - Virtualized Object Shell (**VOS**) written in Rust
            - Built-in **Dropbear SSH** server & **Fastfetch**
            - Default credentials: `root` / `macromag`
