name: Build and Release MacroMag ISO

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-iso-x86_64:
    name: Build PC ISO (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y grub-pc-bin grub-efi-amd64-bin xorriso mtools dosfstools musl-tools wget cpio zip squashfs-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Fetch Full Prebuilt Linux LTS Kernel & Modules
        run: |
          mkdir -p "$GITHUB_WORKSPACE/kernel"
          wget -q "https://dl-cdn.alpinelinux.org/alpine/v3.20/releases/x86_64/netboot/vmlinuz-lts" -O "$GITHUB_WORKSPACE/kernel/vmlinuz"
          wget -q "https://dl-cdn.alpinelinux.org/alpine/v3.20/releases/x86_64/netboot/modloop-lts" -O "$GITHUB_WORKSPACE/kernel/modloop-lts"

      - name: Build Full MacroMag ISO (PC)
        run: chmod +x buildiso.sh && ./buildiso.sh

      - name: Upload x86_64 ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacroMag-x86_64-ISO
          path: |
            MacroMag-x86_64.iso
            MacroMag-x86_64-ISO.zip

  build-iso-aarch64:
    name: Build ARM64 ISO (aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM64 cross-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu grub-common xorriso mtools dosfstools wget cpio zip squashfs-tools
          GRUB_DEB=$(wget -qO- "http://ports.ubuntu.com/pool/main/g/grub2/" | grep -oE 'grub-efi-arm64-bin_[^"]+arm64\.deb' | tail -n 1)
          wget -q "http://ports.ubuntu.com/pool/main/g/grub2/$GRUB_DEB" -O /tmp/grub-arm64.deb
          sudo dpkg-deb -x /tmp/grub-arm64.deb /
          rm -f /tmp/grub-arm64.deb

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Fetch Full Prebuilt Linux LTS Kernel & Modules (ARM64)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/kernel-arm64"
          wget -q "https://dl-cdn.alpinelinux.org/alpine/v3.20/releases/aarch64/netboot/vmlinuz-lts" -O "$GITHUB_WORKSPACE/kernel-arm64/vmlinuz"
          wget -q "https://dl-cdn.alpinelinux.org/alpine/v3.20/releases/aarch64/netboot/modloop-lts" -O "$GITHUB_WORKSPACE/kernel-arm64/modloop-lts"

      - name: Build Full MacroMag ISO (ARM64)
        run: chmod +x buildiso-arm64.sh && ./buildiso-arm64.sh

      - name: Upload aarch64 ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacroMag-aarch64-ISO
          path: |
            MacroMag-aarch64.iso
            MacroMag-aarch64-ISO.zip

  publish-release:
    name: Publish to GitHub Releases
    needs: [build-iso-x86_64, build-iso-aarch64]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all ISO artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum *.iso > SHA256SUMS.txt

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MacroMag-x86_64-ISO.zip
            dist/MacroMag-x86_64.iso
            dist/MacroMag-aarch64-ISO.zip
            dist/MacroMag-aarch64.iso
            dist/SHA256SUMS.txt
          generate_release_notes: true
