name: Build and Release MacroMag ISO

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev grub-pc-bin grub-efi-amd64-bin xorriso mtools dosfstools musl-tools wget cpio zip

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Compile Full Linux Kernel
        run: |
          mkdir -p /tmp/kbuild && cd /tmp/kbuild
          wget -q https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.6.63.tar.xz
          tar -xf linux-6.6.63.tar.xz && cd linux-6.6.63
          make x86_64_defconfig
          cat "$GITHUB_WORKSPACE/kernel/defconfig" >> .config
          make olddefconfig
          make -j$(nproc) bzImage
          cp arch/x86/boot/bzImage "$GITHUB_WORKSPACE/kernel/vmlinuz"

      - name: Build Full MacroMag ISO
        run: chmod +x buildiso.sh && ./buildiso.sh

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            MacroMag-x86_64-ISO.zip
            MacroMag-x86_64.iso
          generate_release_notes: true
