name: Build and Release MacroMag ISO

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y grub-pc-bin grub-efi-amd64-bin xorriso mtools dosfstools musl-tools wget cpio zip squashfs-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Fetch Full Prebuilt Linux LTS Kernel & Modules
        run: |
          mkdir -p "$GITHUB_WORKSPACE/kernel"
          wget -q "https://dl-cdn.alpinelinux.org/alpine/v3.20/releases/x86_64/netboot/vmlinuz-lts" -O "$GITHUB_WORKSPACE/kernel/vmlinuz"
          wget -q "https://dl-cdn.alpinelinux.org/alpine/v3.20/releases/x86_64/netboot/modloop-lts" -O "$GITHUB_WORKSPACE/kernel/modloop-lts"

      - name: Build Full MacroMag ISO
        run: chmod +x buildiso.sh && ./buildiso.sh

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            MacroMag-x86_64-ISO.zip
            MacroMag-x86_64.iso
          generate_release_notes: true


      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacroMag-x86_64-ISO
          path: MacroMag-x86_64.iso
